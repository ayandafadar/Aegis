name: Accessibility Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:  # Manual trigger

jobs:
  accessibility-tests:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Start web server
        run: |
          python serve.py &
          sleep 3  # Wait for server to start

      - name: Run accessibility tests
        id: tests
        run: |
          python -m pytest tests/ -v --tb=short --html=reports/a11y-report.html --self-contained-html --junitxml=reports/junit.xml 2>&1 | tee test-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        env:
          CI: true
        continue-on-error: true

      - name: Generate test summary
        if: always()
        run: |
          echo "## 🔍 Accessibility Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Parse results from output
          if grep -q "passed" test-output.txt; then
            PASSED=$(grep -oP '\d+(?= passed)' test-output.txt | tail -1)
            FAILED=$(grep -oP '\d+(?= failed)' test-output.txt | tail -1 || echo "0")
            TOTAL=$((PASSED + FAILED))
            
            echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| ✅ Passed | $PASSED |" >> $GITHUB_STEP_SUMMARY
            echo "| ❌ Failed | ${FAILED:-0} |" >> $GITHUB_STEP_SUMMARY
            echo "| 📊 Total | $TOTAL |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ steps.tests.outputs.exit_code }}" != "0" ]; then
            echo "### ⚠️ Failed Tests" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -A 5 "FAILED" test-output.txt | head -30 >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "### ✅ All accessibility checks passed!" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📄 Download the full HTML report from the artifacts below." >> $GITHUB_STEP_SUMMARY

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessibility-report
          path: reports/
          retention-days: 30

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: reports/junit.xml
          comment_mode: always
          check_name: "Accessibility Test Results"

      - name: Comment PR with results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const testOutput = fs.readFileSync('test-output.txt', 'utf8');
            
            // Parse results
            const passedMatch = testOutput.match(/(\d+) passed/);
            const failedMatch = testOutput.match(/(\d+) failed/);
            const passed = passedMatch ? passedMatch[1] : '0';
            const failed = failedMatch ? failedMatch[1] : '0';
            
            const status = failed === '0' ? '✅' : '❌';
            const title = failed === '0' ? 'All accessibility tests passed!' : `${failed} accessibility test(s) failed`;
            
            const body = `## ${status} Accessibility Test Results
            
            | Status | Count |
            |--------|-------|
            | ✅ Passed | ${passed} |
            | ❌ Failed | ${failed} |
            
            ${failed !== '0' ? '⚠️ **Please fix accessibility issues before merging.**' : '🎉 **Great job! Your changes are accessible.**'}
            
            📄 [Download full HTML report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) (see Artifacts)
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Fail if tests failed
        if: steps.tests.outputs.exit_code != '0'
        run: exit 1
