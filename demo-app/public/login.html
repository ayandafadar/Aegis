<!DOCTYPE html>
<html>
<!-- A11Y ISSUE: missing lang attribute -->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Signal</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: #f8f9fa;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ─── NAVBAR ─── */
    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 48px;
      background: #fff;
      border-bottom: 1px solid #f0f0f0;
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 22px;
      font-weight: 700;
      color: #1a1a2e;
      text-decoration: none;
    }

    .nav-logo-icon {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, #e8c547, #d4a843);
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
    }

    .nav-logo-icon::after { content: '◆'; color: #fff; font-size: 16px; }

    .nav-back {
      text-decoration: none;
      color: #555;
      font-size: 15px;
      font-weight: 500;
    }

    .nav-back:hover { color: #1a1a2e; }

    /* ─── LOGIN FORM ─── */
    .login-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
    }

    .login-card {
      background: #fff;
      border: 1px solid #e8e8e8;
      border-radius: 16px;
      padding: 48px 40px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.06);
    }

    .login-card h1 {
      font-size: 28px;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 8px;
      text-align: center;
    }

    .login-card .subtitle {
      text-align: center;
      /* A11Y ISSUE: low contrast */
      color: #ccc;
      font-size: 15px;
      margin-bottom: 32px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    /* A11Y ISSUE: no <label> elements, only placeholder text */
    .form-group input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid #e0e0e0;
      border-radius: 10px;
      font-size: 15px;
      color: #333;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus {
      border-color: #7c5cfc;
      box-shadow: 0 0 0 3px rgba(124, 92, 252, 0.1);
    }

    .form-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .form-options label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: #666;
      cursor: pointer;
    }

    .form-options a {
      font-size: 14px;
      color: #7c5cfc;
      text-decoration: none;
    }

    .form-options a:hover { text-decoration: underline; }

    .btn-login {
      width: 100%;
      padding: 14px;
      background: #1a1a2e;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-login:hover { background: #2d2d4e; }

    .divider {
      text-align: center;
      margin: 24px 0;
      position: relative;
    }

    .divider::before {
      content: '';
      position: absolute;
      top: 50%; left: 0; right: 0;
      border-top: 1px solid #e8e8e8;
    }

    .divider span {
      background: #fff;
      padding: 0 16px;
      position: relative;
      font-size: 13px;
      color: #aaa;
    }

    .social-btns {
      display: flex;
      gap: 12px;
    }

    .social-btn {
      flex: 1;
      padding: 12px;
      border: 1px solid #e0e0e0;
      border-radius: 10px;
      background: #fff;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s;
      color: #555;
    }

    .social-btn:hover { background: #f5f5f5; }

    .signup-link {
      text-align: center;
      margin-top: 24px;
      font-size: 14px;
      color: #888;
    }

    .signup-link a { color: #7c5cfc; text-decoration: none; }
    .signup-link a:hover { text-decoration: underline; }

    /* A11Y ISSUE: decorative image without alt */
    .login-banner {
      margin: 0 auto 24px;
      display: block;
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <nav>
    <a href="/" class="nav-logo">
      <div class="nav-logo-icon"></div>
      Signal
    </a>
    <a href="/" class="nav-back">← Back to home</a>
  </nav>

  <!-- LOGIN -->
  <div class="login-container">
    <div class="login-card">
      <!-- A11Y ISSUE: image without alt text -->
      <img src="/img/login-illustration.png" class="login-banner" width="80" height="80">

      <h1>Welcome back</h1>
      <p class="subtitle">Sign in to your Signal account</p>

      <form action="/login" method="POST" id="login-form">
        <!-- A11Y ISSUE: inputs without associated labels -->
        <div class="form-group">
          <input type="email" name="email" id="email" placeholder="Email address" required>
        </div>
        <div class="form-group">
          <input type="password" name="password" id="password" placeholder="Password" required>
        </div>

        <div class="form-options">
          <label>
            <input type="checkbox"> Remember me
          </label>
          <a href="#">Forgot password?</a>
        </div>

        <button type="submit" class="btn-login">Sign in</button>
      </form>

      <div class="divider"><span>or continue with</span></div>

      <div class="social-btns">
        <button class="social-btn" type="button">🔵 Google</button>
        <button class="social-btn" type="button">⬛ GitHub</button>
      </div>

      <p class="signup-link">Don't have an account? <a href="/contact">Get started</a></p>
    </div>
  </div>

</body>
</html>
