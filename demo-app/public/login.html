<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signal Demo App - Login</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Segoe UI, Arial, sans-serif; background: #f6f8fb; color: #1f2937; }
    .site-header { background: #fff; border-bottom: 1px solid #e5e7eb; }
    nav { max-width: 1280px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 14px 24px; }
    .nav-logo { text-decoration: none; font-weight: 700; color: #111827; font-size: 18px; }
    .nav-back { text-decoration: none; color: #374151; font-size: 14px; }
    .login-container { min-height: calc(100vh - 60px); display: grid; place-items: center; padding: 24px; }
    .login-card { width: 100%; max-width: 420px; background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 24px; }
    .login-card h1 { margin-bottom: 8px; }
    .subtitle { color: #c7c7c7; margin-bottom: 16px; }
    .form-group { margin-bottom: 12px; }
    .form-group input { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; }
    .form-options { display: flex; justify-content: space-between; margin: 10px 0 14px; font-size: 14px; }
    .btn-login { width: 100%; padding: 10px; border: 0; background: #0f172a; color: #fff; border-radius: 6px; cursor: pointer; }
    .signup-link { margin-top: 14px; font-size: 14px; color: #6b7280; text-align: center; }
    .signup-link a { color: #1d4ed8; text-decoration: none; }
    @media (max-width: 900px) { nav { padding: 12px 16px; } }
  </style>
</head>
<body>
  <header class="site-header">
    <nav>
      <a href="/" class="nav-logo">Aegis Demo</a>
      <a href="/" class="nav-back">Back to home</a>
    </nav>
  </header>

  <div class="login-container">
    <div class="login-card">
      <img src="/img/login-illustration.png" class="login-banner" width="64" height="64">
      <h1>Sign in</h1>
      <p class="subtitle">Use this form to validate Selenium + a11y checks.</p>

      <form action="/login" method="POST" id="login-form">
        <div class="form-group">
          <input type="email" name="email" id="email" placeholder="Email address" required>
        </div>
        <div class="form-group">
          <input type="password" name="password" id="password" placeholder="Password" required>
        </div>

        <div class="form-options">
          <label><input type="checkbox"> Remember me</label>
          <a href="#">Forgot password?</a>
        </div>

        <button type="submit" class="btn-login">Sign in</button>
      </form>

      <p class="signup-link">Need access? <a href="/contact">Request demo</a></p>
    </div>
  </div>
</body>
</html>
