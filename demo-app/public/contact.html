<!DOCTYPE html>
<html>
<!-- A11Y ISSUE: missing lang attribute -->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - Signal</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: #f8f9fa;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ─── NAVBAR ─── */
    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 48px;
      background: #fff;
      border-bottom: 1px solid #f0f0f0;
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 22px;
      font-weight: 700;
      color: #1a1a2e;
      text-decoration: none;
    }

    .nav-logo-icon {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, #e8c547, #d4a843);
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
    }

    .nav-logo-icon::after { content: '◆'; color: #fff; font-size: 16px; }

    .nav-back {
      text-decoration: none;
      color: #555;
      font-size: 15px;
      font-weight: 500;
    }

    .nav-back:hover { color: #1a1a2e; }

    /* ─── CONTACT LAYOUT ─── */
    .contact-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
    }

    .contact-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 48px;
      max-width: 900px;
      width: 100%;
    }

    .contact-info h1 {
      font-size: 36px;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 16px;
    }

    .contact-info p {
      font-size: 16px;
      /* A11Y ISSUE: low contrast text */
      color: #c8c8c8;
      line-height: 1.7;
      margin-bottom: 32px;
    }

    .info-item {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
    }

    .info-icon {
      width: 44px; height: 44px;
      background: #ede9fe;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
    }

    .info-item div strong {
      display: block;
      font-size: 14px;
      color: #1a1a2e;
    }

    .info-item div span {
      font-size: 14px;
      color: #888;
    }

    /* ─── CONTACT FORM ─── */
    .contact-card {
      background: #fff;
      border: 1px solid #e8e8e8;
      border-radius: 16px;
      padding: 40px 36px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.06);
    }

    .contact-card h2 {
      font-size: 22px;
      font-weight: 600;
      color: #1a1a2e;
      margin-bottom: 24px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    /* A11Y ISSUE: no <label> elements for form inputs */
    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid #e0e0e0;
      border-radius: 10px;
      font-size: 15px;
      color: #333;
      outline: none;
      transition: border-color 0.2s;
      font-family: inherit;
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      border-color: #7c5cfc;
      box-shadow: 0 0 0 3px rgba(124, 92, 252, 0.1);
    }

    .form-group textarea {
      resize: vertical;
      min-height: 120px;
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background: #1a1a2e;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-submit:hover { background: #2d2d4e; }

    /* A11Y ISSUE: image without alt */
    .contact-decor {
      display: block;
      margin: 0 auto 20px;
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <nav>
    <a href="/" class="nav-logo">
      <div class="nav-logo-icon"></div>
      Signal
    </a>
    <a href="/" class="nav-back">← Back to home</a>
  </nav>

  <!-- CONTACT -->
  <div class="contact-wrapper">
    <div class="contact-grid">
      <!-- LEFT: Info -->
      <div class="contact-info">
        <h1>Book a demo</h1>
        <p>See how Signal can transform your RevOps workflow. Fill out the form and our team will reach out within 24 hours.</p>

        <div class="info-item">
          <div class="info-icon">📧</div>
          <div>
            <strong>Email</strong>
            <span>hello@signal.io</span>
          </div>
        </div>

        <div class="info-item">
          <div class="info-icon">📞</div>
          <div>
            <strong>Phone</strong>
            <span>+1 (555) 123-4567</span>
          </div>
        </div>

        <div class="info-item">
          <div class="info-icon">📍</div>
          <div>
            <strong>Office</strong>
            <span>San Francisco, CA</span>
          </div>
        </div>

        <!-- A11Y ISSUE: image without alt -->
        <img src="/img/contact-decoration.png" class="contact-decor" width="200">
      </div>

      <!-- RIGHT: Form -->
      <div class="contact-card">
        <!-- A11Y ISSUE: image without alt -->
        <img src="/img/form-header.png" width="48" height="48" style="margin-bottom: 16px;">

        <h2>Send us a message</h2>

        <form action="/contact" method="POST" id="contact-form">
          <div class="form-row">
            <!-- A11Y ISSUE: no label associations -->
            <div class="form-group">
              <input type="text" name="firstName" id="firstName" placeholder="First name" required>
            </div>
            <div class="form-group">
              <input type="text" name="lastName" id="lastName" placeholder="Last name" required>
            </div>
          </div>

          <div class="form-group">
            <input type="email" name="email" id="contactEmail" placeholder="Work email" required>
          </div>

          <div class="form-group">
            <input type="text" name="company" id="company" placeholder="Company name">
          </div>

          <div class="form-group">
            <select name="teamSize" id="teamSize">
              <option value="">Team size</option>
              <option value="1-10">1-10</option>
              <option value="11-50">11-50</option>
              <option value="51-200">51-200</option>
              <option value="200+">200+</option>
            </select>
          </div>

          <div class="form-group">
            <textarea name="message" id="message" placeholder="How can we help you?"></textarea>
          </div>

          <button type="submit" class="btn-submit">Send message</button>
        </form>
      </div>
    </div>
  </div>

</body>
</html>
