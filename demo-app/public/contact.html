<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aegis Demo App - Contact</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Segoe UI, Arial, sans-serif; background: #f6f8fb; color: #1f2937; }
    .site-header { background: #fff; border-bottom: 1px solid #e5e7eb; }
    nav { max-width: 1280px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 14px 24px; }
    .nav-logo { text-decoration: none; font-weight: 700; color: #111827; font-size: 18px; }
    .nav-back { text-decoration: none; color: #374151; font-size: 14px; }
    .contact-wrapper { padding: 24px; max-width: 980px; margin: 0 auto; }
    .contact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .contact-info, .contact-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 20px; }
    .contact-info p { color: #c7c7c7; margin: 10px 0 16px; }
    .info-item { margin-bottom: 10px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .form-group { margin-bottom: 10px; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; font-family: inherit; }
    .form-group textarea { min-height: 100px; resize: vertical; }
    .btn-submit { width: 100%; padding: 10px; border: 0; border-radius: 6px; background: #0f172a; color: #fff; cursor: pointer; }
    .a11y-callout { margin-top: 14px; padding: 10px 12px; background: #fff4e5; border: 1px solid #f6c47a; border-radius: 8px; font-size: 13px; color: #7a5200; }
    .a11y-mark { position: relative; outline: 2px dashed #f59e0b; outline-offset: 2px; }
    .a11y-mark::after {
      content: attr(data-issue);
      position: absolute;
      top: -10px;
      right: 8px;
      font-size: 11px;
      line-height: 1;
      color: #7a5200;
      background: #fff4e5;
      border: 1px solid #f6c47a;
      border-radius: 10px;
      padding: 3px 6px;
    }
    @media (max-width: 900px) { .contact-grid, .form-row { grid-template-columns: 1fr; } nav { padding: 12px 16px; } }
  </style>
</head>
<body>
  <header class="site-header">
    <nav>
      <a href="/" class="nav-logo">Aegis Demo</a>
      <a href="/" class="nav-back">Back to home</a>
    </nav>
  </header>

  <div class="contact-wrapper">
    <div class="contact-grid">
      <div class="contact-info">
        <h1>Book a demo</h1>
        <p class="a11y-mark" data-issue="contrast">This is a testing page with intentional accessibility gaps for scanner output.</p>
        <div class="info-item"><strong>Email:</strong> hello@aegis.demo</div>
        <div class="info-item"><strong>Phone:</strong> +1 555 0100</div>
        <div class="info-item"><strong>Office:</strong> Remote-first</div>
        <img src="/img/contact-decoration.png" class="contact-decor a11y-mark" data-issue="missing alt" width="180">
        <div class="a11y-callout">Demo markers highlight intentional issues reported by axe: contrast, image alt text, and form naming.</div>
      </div>

      <div class="contact-card">
        <img src="/img/form-header.png" class="a11y-mark" data-issue="missing alt" width="40" height="40" style="margin-bottom:10px;">
        <h2>Contact form</h2>

        <form action="/contact" method="POST" id="contact-form">
          <div class="form-row">
            <div class="form-group"><input type="text" name="firstName" id="firstName" placeholder="First name" required></div>
            <div class="form-group"><input type="text" name="lastName" id="lastName" placeholder="Last name" required></div>
          </div>
          <div class="form-group"><input type="email" name="email" id="contactEmail" placeholder="Work email" required></div>
          <div class="form-group"><input type="text" name="company" id="company" placeholder="Company"></div>
          <div class="form-group">
            <select name="teamSize" id="teamSize" class="a11y-mark" data-issue="no label">
              <option value="">Team size</option>
              <option value="1-10">1-10</option>
              <option value="11-50">11-50</option>
              <option value="50+">50+</option>
            </select>
          </div>
          <div class="form-group"><textarea name="message" id="message" placeholder="How can we help?"></textarea></div>
          <button type="submit" class="btn-submit">Send message</button>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
