<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Aegis</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to main content</a>

    <header role="banner">
        <div class="header-inner">
            <div class="header-left">
                <a href="index.html" class="logo" aria-label="Aegis Home">
                    <svg viewBox="0 0 32 32" aria-hidden="true" fill="currentColor">
                        <path d="M16 2L3 28h26L16 2zm0 6l9.5 18H6.5L16 8z"/>
                        <circle cx="16" cy="22" r="2"/>
                        <rect x="15" y="14" width="2" height="6"/>
                    </svg>
                    Aegis
                </a>
                <nav aria-label="Main navigation">
                    <ul role="list">
                        <li><a href="index.html">Home</a></li>
                        <li><a href="dashboard.html">Dashboard</a></li>
                        <li><a href="form.html" aria-current="page">Contact</a></li>
                    </ul>
                </nav>
            </div>
            <div class="header-right">
                <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode">
                    <svg class="theme-toggle-icon theme-toggle-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="5"/>
                        <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
                    </svg>
                    <span class="sr-only">Toggle theme</span>
                </button>
            </div>
        </div>
    </header>

    <main id="main-content" role="main">
        <h1 class="section-title">Contact Us</h1>

        <div class="form-container">
            <form id="contact-form" novalidate>
                <div class="form-group">
                    <label for="full-name">Full Name <span class="required-star" aria-hidden="true">*</span></label>
                    <input type="text" id="full-name" name="fullName" required aria-required="true">
                </div>

                <div class="form-group">
                    <label for="email">Email <span class="required-star" aria-hidden="true">*</span></label>
                    <input type="email" id="email" name="email" required aria-required="true">
                </div>

                <!-- DEMO BUG #2: Input without label (fix: add <label for="phone">Phone</label>) -->
                <div class="form-group">
                    <input type="tel" id="phone" name="phone" placeholder="Phone Number">
                </div>

                <div class="form-group">
                    <label for="message">Message <span class="required-star" aria-hidden="true">*</span></label>
                    <textarea id="message" name="message" rows="4" required aria-required="true"></textarea>
                </div>

                <button type="submit" class="btn btn-primary">Submit</button>
            </form>
        </div>
    </main>

    <footer role="contentinfo">
        <p>&copy; 2026 Aegis Accessibility Testing Platform.</p>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
